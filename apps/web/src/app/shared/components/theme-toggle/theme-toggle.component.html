<p-button
  *transloco="let t"
  severity="secondary"
  class="theme-button"
  size="small"
  styleClass="size-10 min-w-10 [@media(pointer:coarse)]:size-11 [@media(pointer:coarse)]:min-w-11"
  [ariaLabel]="t(themeLabel())"
  [title]="t(themeLabel())"
  (click)="toggleTheme()"
  [icon]="themeIcon()"
/>
