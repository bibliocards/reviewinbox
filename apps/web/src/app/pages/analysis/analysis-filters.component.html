<section
  class="grid gap-4 rounded-xl border border-hairline bg-surface-1 p-4"
  aria-labelledby="analysis-filters-title"
  *transloco="let t"
>
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 id="analysis-filters-title" class="m-0 text-base font-semibold text-ink">
      {{ t('analysis.filters.title') }}
    </h2>
    @if (
      from()
      || to()
      || provider()
      || version()
      || severity()
      || intent()
      || topicId()
      || topicStatus()
    ) {
      <p-button
        severity="secondary"
        [text]="true"
        size="small"
        [label]="t('analysis.filters.clear')"
        icon="pi pi-times"
        (onClick)="clear.emit()"
      />
    }
  </div>
  <div class="grid grid-cols-1 items-end gap-2.5 sm:grid-cols-2 xl:grid-cols-4">
    <ri-app-select
      [options]="appOptions()"
      [selectedAppId]="selectedAppId()"
      [ariaLabel]="t('analysis.filters.app')"
      (selectedAppIdChange)="emit('appId', $event)"
    />
    <label class="grid gap-1 text-xs font-semibold text-ink-subtle" for="analysis-from-date"
      ><span>{{ t('analysis.filters.from') }}</span
      ><p-datepicker
        inputId="analysis-from-date"
        appendTo="body"
        dateFormat="yy-mm-dd"
        [ngModel]="fromDate()"
        [showButtonBar]="true"
        [showIcon]="true"
        [ariaLabel]="t('analysis.filters.from')"
        (ngModelChange)="emitDate('from', $event)"
    /></label>
    <label class="grid gap-1 text-xs font-semibold text-ink-subtle" for="analysis-to-date"
      ><span>{{ t('analysis.filters.to') }}</span
      ><p-datepicker
        inputId="analysis-to-date"
        appendTo="body"
        dateFormat="yy-mm-dd"
        [ngModel]="toDate()"
        [showButtonBar]="true"
        [showIcon]="true"
        [ariaLabel]="t('analysis.filters.to')"
        (ngModelChange)="emitDate('to', $event)"
    /></label>
    <p-select
      appendTo="body"
      [options]="storeOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="provider()"
      (ngModelChange)="emit('provider', $event)"
      [fluid]="true"
      [ariaLabel]="t('analysis.filters.store')"
    />
    <p-select
      appendTo="body"
      [options]="versionOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="version()"
      (ngModelChange)="emit('version', $event)"
      [fluid]="true"
      [ariaLabel]="t('analysis.filters.version')"
    />
    <p-select
      appendTo="body"
      [options]="severityOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="severity()"
      (ngModelChange)="emit('severity', $event)"
      [fluid]="true"
      [ariaLabel]="t('analysis.filters.severity')"
    />
    <p-select
      appendTo="body"
      [options]="intentOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="intent()"
      (ngModelChange)="emit('intent', $event)"
      [fluid]="true"
      [ariaLabel]="t('analysis.filters.intent')"
    />
    <p-select
      appendTo="body"
      [options]="topicOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="topicId()"
      (ngModelChange)="emit('topicId', $event)"
      [fluid]="true"
      [ariaLabel]="t('analysis.filters.topic')"
    />
    <p-select
      appendTo="body"
      [options]="topicStatusOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="topicStatus()"
      (ngModelChange)="emit('topicStatus', $event)"
      [fluid]="true"
      [ariaLabel]="t('analysis.filters.topicStatus')"
    />
  </div>
  @if (version() && !provider()) {
    <p class="m-0 text-xs text-amber-700 dark:text-amber-300">
      <i class="pi pi-info-circle mr-1" aria-hidden="true"></i
      >{{ t('analysis.filters.versionNeedsStore') }}
    </p>
  }
</section>
